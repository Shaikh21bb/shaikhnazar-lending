<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SHAIKH Agent Hub — Вход в личный кабинет</title>
    <meta name="description" content="Закрытый клиентский кабинет SHAIKH Agent Hub: ИИ-агент, заметки, календарь и учет расходов.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="./css/app.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0A0A0C">
    <link rel="icon" href="/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
</head>
<body>

    <div class="glass-orb orb-1"></div>
    <div class="glass-orb orb-2"></div>
    <div class="glass-orb orb-3"></div>

    <div class="auth-wrap">
        <div class="auth-card glass">
            <div class="auth-logo">
                <span class="auth-logo-pill">shaikh</span>
            </div>
            <div class="auth-lang">
                <button type="button" class="lang-btn active" data-lang="ru">RU</button>
                <button type="button" class="lang-btn" data-lang="kk">Қазақша</button>
            </div>
            <h1 data-i18n="title">Вход в SHAIKH Agent Hub</h1>
            <p class="auth-sub" data-i18n="subtitle">Закрытый клиентский кабинет: ИИ-агент, заметки, календарь и расходы — в одном месте.</p>

            <div id="auth-error" role="alert" aria-live="polite"></div>

            <form id="auth-form" class="auth-form">
                <label for="email" data-i18n="login">Логин (Email)</label>
                <input type="text" id="email" required placeholder="name@company.com" autocomplete="username">
                <label for="password" data-i18n="pass">Пароль</label>
                <div class="password-wrap">
                    <input type="password" id="password" class="pw-input" required placeholder="••••••••" autocomplete="current-password">
                    <button type="button" class="toggle-password" id="toggle-password" aria-label="Показать пароль" title="Показать пароль">
                        <svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" fill="none" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <button type="submit" class="island island-primary auth-submit" id="submit-btn" data-i18n="enter">Войти</button>
            </form>

            <div class="auth-footer" id="toggle-wrap">
                <a href="index.html" data-i18n="back">← Вернуться на сайт</a>
                <span aria-hidden="true">·</span>
                <a href="admin.html" data-i18n="owner">Панель владельца</a>
            </div>
        </div>
    </div>

    <script>
        const LOGIN_I18N = {
            ru: {
                pageTitle: 'SHAIKH Agent Hub — Вход в личный кабинет',
                description: 'Закрытый клиентский кабинет SHAIKH Agent Hub: ИИ-агент, заметки, календарь и учет расходов.',
                title: 'Вход в SHAIKH Agent Hub',
                subtitle: 'Закрытый клиентский кабинет: ИИ-агент, заметки, календарь и расходы — в одном месте.',
                login: 'Логин (Email)',
                pass: 'Пароль',
                enter: 'Войти',
                loading: 'Вход...',
                showPass: 'Показать пароль',
                hidePass: 'Скрыть пароль',
                back: '← Вернуться на сайт',
                owner: 'Панель владельца',
                fill: 'Пожалуйста, заполните все поля.',
                err: 'Ошибка: Неверный логин или пароль',
                conn: 'Произошла ошибка при связи с базой данных.'
            },
            kk: {
                pageTitle: 'SHAIKH Agent Hub — Жеке кабинетке кіру',
                description: 'SHAIKH Agent Hub жабық клиенттік кабинеті: AI-агент, жазбалар, күнтізбе және шығындарды есепке алу.',
                title: 'SHAIKH Agent Hub жүйесіне кіру',
                subtitle: 'Жабық клиенттік кабинетіңіз: AI-агент, жазбалар, күнтізбе және шығындар — бір жерде.',
                login: 'Логин (Email)',
                pass: 'Құпия сөз',
                enter: 'Кіру',
                loading: 'Кіру...',
                showPass: 'Құпия сөзді көрсету',
                hidePass: 'Құпия сөзді жасыру',
                back: '← Сайтқа қайту',
                owner: 'Иесінің панелі',
                fill: 'Барлық өрістерді толтырыңыз.',
                err: 'Қате: логин немесе құпия сөз дұрыс емес',
                conn: 'Деректер базасымен байланыста қате орын алды.'
            }
        };
        let loginLang = localStorage.getItem('shaikh_lang') === 'kz' ? 'kk' : (localStorage.getItem('shaikh_lang') || 'ru');
        function applyLoginLang(lang) {
            const t = LOGIN_I18N[lang] || LOGIN_I18N.ru;
            document.documentElement.lang = lang;
            document.title = t.pageTitle;
            const description = document.querySelector('meta[name="description"]');
            if (description) description.content = t.description;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.getAttribute('data-i18n');
                if (t[k]) el.textContent = t[k];
            });
            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            if (togglePassword && passwordInput) {
                const label = passwordInput.type === 'password' ? t.showPass : t.hidePass;
                togglePassword.setAttribute('aria-label', label);
                togglePassword.title = label;
            }
            const err = document.getElementById('auth-error');
            if (err) err.style.display = 'none';
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
        }
        applyLoginLang(loginLang);
        document.querySelectorAll('.lang-btn').forEach(b => {
            b.addEventListener('click', () => {
                loginLang = b.dataset.lang;
                localStorage.setItem('shaikh_lang', loginLang);
                applyLoginLang(loginLang);
            });
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const authForm = document.getElementById('auth-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const togglePassword = document.getElementById('toggle-password');
            const submitBtn = document.getElementById('submit-btn');
            const authError = document.getElementById('auth-error');

            if (togglePassword) {
                togglePassword.addEventListener('click', () => {
                    const show = passwordInput.type === 'password';
                    passwordInput.type = show ? 'text' : 'password';
                    togglePassword.classList.toggle('visible', show);
                    const t = LOGIN_I18N[loginLang] || LOGIN_I18N.ru;
                    const label = show ? t.hidePass : t.showPass;
                    togglePassword.setAttribute('aria-label', label);
                    togglePassword.title = label;
                });
            }

            const destinationFor = role => role === 'client' ? 'hub.html' : 'dashboard.html';
            if (localStorage.getItem('auth_token')) {
                try {
                    const response = await fetch('/api/auth/session', { cache: 'no-store' });
                    if (response.ok) {
                        const session = await response.json();
                        window.location.replace(destinationFor(session.user?.role));
                        return;
                    }
                } catch (_) { /* show login form */ }
                localStorage.removeItem('auth_token');
                localStorage.removeItem('auth_email');
            }

            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const t = LOGIN_I18N[loginLang] || LOGIN_I18N.ru;
                const login = emailInput.value.trim();
                const password = passwordInput.value.trim();

                if (!login || !password) {
                    if (authError) {
                        authError.textContent = t.fill;
                        authError.style.display = 'block';
                    } else {
                        alert(t.fill);
                    }
                    return;
                }

                submitBtn.disabled = true;
                const originalText = submitBtn.textContent;
                submitBtn.textContent = t.loading;
                if (authError) authError.style.display = 'none';

                try {
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ login, password })
                    });
                    const data = await response.json();

                    if (response.ok) {
                        localStorage.setItem('auth_token', data.id);
                        localStorage.setItem('auth_email', data.login);
                        window.location.href = destinationFor(data.role);
                    } else {
                        if (authError) {
                            authError.textContent = t.err;
                            authError.style.display = 'block';
                        } else {
                            alert(t.err);
                        }
                    }
                } catch (error) {
                    console.error('Ошибка входа:', error);
                    if (authError) {
                        authError.textContent = t.conn;
                        authError.style.display = 'block';
                    } else {
                        alert(t.conn);
                    }
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                }
            });
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
