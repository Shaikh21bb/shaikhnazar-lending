<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SHAIKH Industries — Вход в систему</title>
    <meta name="description" content="Вход в систему SHAIKH Industries">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/app.css">
</head>
<body>

    <div class="glass-orb orb-1"></div>
    <div class="glass-orb orb-2"></div>
    <div class="glass-orb orb-3"></div>

    <div class="auth-wrap">
        <div class="auth-card glass">
            <div class="auth-logo">
                <span class="auth-logo-pill">shaikh</span>
            </div>
            <h1>Вход в систему</h1>
            <p class="auth-sub">Вход в систему для бизнеса</p>

            <div id="auth-error"></div>

            <form id="auth-form" class="auth-form">
                <label for="email">Логин (Email)</label>
                <input type="text" id="email" required placeholder="name@company.com" autocomplete="username">
                <label for="password">Пароль</label>
                <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                <button type="submit" class="island island-primary auth-submit" id="submit-btn">Войти</button>
            </form>

            <div class="auth-footer" id="toggle-wrap">
                <a href="index.html">← Вернуться на сайт</a>
                <span aria-hidden="true">·</span>
                <a href="admin.html">Панель владельца</a>
            </div>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./js/supabase.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const authForm = document.getElementById('auth-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submit-btn');
            const authError = document.getElementById('auth-error');

            const token = localStorage.getItem('auth_token');
            if (token) {
                window.location.href = 'dashboard.html';
                return;
            }

            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const login = emailInput.value.trim();
                const password = passwordInput.value.trim();

                if (!login || !password) {
                    alert('Пожалуйста, заполните все поля.');
                    return;
                }

                submitBtn.disabled = true;
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Вход...';
                if (authError) authError.style.display = 'none';

                try {
                    const { data, error } = await supabaseClient
                        .from('managers_auth')
                        .select('*')
                        .eq('login', login)
                        .eq('password', password);

                    if (error) throw error;

                    if (data && data.length > 0) {
                        localStorage.setItem('auth_token', data[0].id);
                        localStorage.setItem('auth_email', data[0].login);
                        window.location.href = 'dashboard.html';
                    } else {
                        if (authError) {
                            authError.textContent = 'Ошибка: Неверный логин или пароль';
                            authError.style.display = 'block';
                        } else {
                            alert('Ошибка: Неверный логин или пароль');
                        }
                    }
                } catch (error) {
                    console.error('Ошибка входа:', error);
                    if (authError) {
                        authError.textContent = 'Произошла ошибка при связи с базой данных.';
                        authError.style.display = 'block';
                    } else {
                        alert('Произошла ошибка при связи с базой данных.');
                    }
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                }
            });
        });
    </script>
</body>
</html>
