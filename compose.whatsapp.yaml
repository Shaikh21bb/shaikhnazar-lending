services:
  whatsapp-bridge:
    build:
      context: ./worker
    restart: unless-stopped
    init: true
    env_file:
      - .env.worker.local
    environment:
      WHATSAPP_SESSION_DIR: /app/session
      LOCAL_AGENT_ENABLED: "true"
      LOCAL_AGENT_MODEL: ${LOCAL_AGENT_MODEL:-qwen3.5:9b-mlx}
    volumes:
      - whatsapp-session:/app/session
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  whatsapp-session:
